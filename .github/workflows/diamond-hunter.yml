name: Amazon Diamond Hunter FREE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bot.py'
      - 'alerts.py'
      - 'signals.py'
      - 'media.py'
      - 'catalog.py'
      - 'tests/**'
      - 'preferences-draft.json'
      - '.github/workflows/diamond-hunter.yml'
      - 'state-store.sh'
      - 'pricechecks.py'
      - 'observations.py'
      - 'catalog_ui.py'
      - 'amazon_direct.py'
      - 'direct_pipeline.py'
      - 'fast_hunter.py'
      - 'keepa_discovery.py'
      - 'brightdata_verify.py'
      - 'brightdata_search.py'
      - 'retail_scope.py'
      - 'retailer_direct.py'
      - 'brightdata_probe.py'
  schedule:
    - cron: "3,18,33,48 * * * *" # Full discovery every 15m
    - cron: "8,13,23,28,38,43,53,58 * * * *" # EU rapid scans between full runs
    - cron: "0 19,20 * * *" # 21:00 Paris in summer/winter; bot checks local time
permissions:
  contents: read
concurrency:
  group: diamond-hunter
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish periodic public snapshots to diamond-data
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Restore seen-items cache
        # Preserve accumulated offers on push dry-run storefront rebuilds.
        uses: actions/cache/restore@v4
        with:
          path: |
            seen.json
            catalog.sqlite
          key: diamond-state-${{ github.run_id }}
          restore-keys: |
            diamond-state-
      - name: Restore durable catalog if Actions cache is missing
        run: bash state-store.sh restore
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check Bright Data integration status (no network, no billing)
        if: github.event_name == 'push'
        env:
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          BRIGHTDATA_UNLOCKER_ZONE: ${{ secrets.BRIGHTDATA_UNLOCKER_ZONE }}
          BRIGHTDATA_CDISCOUNT_MAX_DAILY: '8'
        run: |
          python3 -c 'import os; print("BRIGHT DATA TOKEN:", "CONNECTED" if os.getenv("BRIGHTDATA_API_TOKEN", "").strip() else "NOT CONFIGURED IN GITHUB ACTIONS")'
      - name: Bright Data integration probe
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[brightdata-smoke]')
        continue-on-error: true
        env:
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          BRIGHTDATA_UNLOCKER_ZONE: ${{ secrets.BRIGHTDATA_UNLOCKER_ZONE }}
          BRIGHTDATA_CDISCOUNT_MAX_DAILY: '8'
        run: python3 brightdata_probe.py
      - name: Dry-run global RSS scan (push, no Telegram)
        # Explicit marker runs a one-off FREE merchant scan instead, so
        # the site receives actual shop data without paid API credentials.
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[free-retailer-scan]')
        env:
          DRY_RUN: 'true'
          CATALOG_ENABLED: 'true'
          RETAILER_ONLY: 'true'
          EXTRA_RSS_FEEDS: ${{ vars.EXTRA_RSS_FEEDS }}
          PEPPER_GRAPHQL_ENABLED: 'true'
          DIRECT_AMAZON_ENABLED: 'false' # No credentials in preview.
          # Push preview has no real-price key configured.
          MAX_NOTIFICATIONS: '3'
        run: python3 bot.py
      - name: Send Telegram connection test (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c 'from bot import telegram_send; telegram_send("💎 Amazon Diamond Hunter: тест успешен, Telegram подключён!")'
      - name: Scan and alert
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[free-retailer-scan]')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_DISCOUNT: '25'
          MAX_NOTIFICATIONS: '5'
          DRY_RUN: 'false'
          CATALOG_ENABLED: 'true'
          RETAILER_ONLY: 'true'
          EXTRA_RSS_FEEDS: ${{ vars.EXTRA_RSS_FEEDS }}
          PEPPER_GRAPHQL_ENABLED: 'true'
          KEEPA_API_KEY: ${{ github.event_name != 'push' && secrets.KEEPA_API_KEY || '' }}
          KEEPA_MAX_DEAL_QUERIES_PER_DAY: '64'
          BRIGHTDATA_API_TOKEN: ${{ github.event_name != 'push' && secrets.BRIGHTDATA_API_TOKEN || '' }}
          BRIGHTDATA_UNLOCKER_ZONE: ${{ github.event_name != 'push' && secrets.BRIGHTDATA_UNLOCKER_ZONE || '' }}
          BRIGHTDATA_CDISCOUNT_MAX_DAILY: '8'
          BRIGHTDATA_PER_SCAN: ${{ github.event_name != 'push' && '1' || '0' }}
          BRIGHTDATA_SEARCH_ENABLED: ${{ github.event_name != 'push' && 'true' || 'false' }}
          BRIGHTDATA_SEARCH_PER_DAY: '1'
          DIRECT_AMAZON_ENABLED: ${{ github.event_name != 'push' && 'true' || 'false' }}
          RETAIL_DIRECT_ENABLED: 'true'
          RETAIL_PRODUCT_CHECKS_PER_SHOP: '2'
          RETAIL_JOYBUY_PRODUCT_CHECKS_PER_SCAN: '6'
          AMAZON_CREATORS_CLIENT_ID: ${{ github.event_name != 'push' && secrets.AMAZON_CREATORS_CLIENT_ID || '' }}
          AMAZON_CREATORS_CLIENT_SECRET: ${{ github.event_name != 'push' && secrets.AMAZON_CREATORS_CLIENT_SECRET || '' }}
          AMAZON_PARTNER_TAG_FR: ${{ github.event_name != 'push' && secrets.AMAZON_PARTNER_TAG_FR || '' }}
          AMAZON_PARTNER_TAG_DE: ${{ github.event_name != 'push' && secrets.AMAZON_PARTNER_TAG_DE || '' }}
          AMAZON_PARTNER_TAG_ES: ${{ github.event_name != 'push' && secrets.AMAZON_PARTNER_TAG_ES || '' }}
          AMAZON_PARTNER_TAG_IT: ${{ github.event_name != 'push' && secrets.AMAZON_PARTNER_TAG_IT || '' }}
          DIRECT_MAX_QUERIES: '5'
          DIRECT_WATCH_BATCHES: '2'
          DIRECT_ONLY_RUN: ${{ github.event.schedule == '8,13,23,28,38,43,53,58 * * * *' && 'true' || 'false' }}
        run: python3 bot.py
      - name: Save seen-items cache
        if: success() && (github.event_name != 'push' || contains(github.event.head_commit.message, '[free-retailer-scan]'))
        uses: actions/cache/save@v4
        with:
          path: |
            seen.json
            catalog.sqlite
          key: diamond-state-${{ github.run_id }}
      - name: Preserve durable daily catalog snapshot
        if: success() && (github.event_name != 'push' || contains(github.event.head_commit.message, '[free-retailer-scan]'))
        continue-on-error: true
        run: bash state-store.sh backup
      - name: Publish browsable findings database
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: diamond-findings-${{ github.run_id }}
          path: |
            catalog.sqlite
            catalog_export/index.html
            catalog_export/finds.csv
            catalog_export/finds.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 9

  deploy_site:
    name: Publish free deal storefront
    needs: scan
    # Ordinary pushes are dry runs and must not overwrite real retailer data.
    # A deliberately tagged free-retailer scan publishes only first-party
    # shop data, with all billable provider credentials disabled.
    if: needs.scan.result == 'success' && (github.event_name != 'push' || contains(github.event.head_commit.message, '[free-retailer-scan]'))
    runs-on: ubuntu-latest
    # GitHub Pages may require one-time owner activation in Settings.
    # A deploy problem must not prevent scans and Telegram delivery.
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: diamond-hunter-pages
      cancel-in-progress: true
    steps:
      - name: Download storefront from this scan
        uses: actions/download-artifact@v4
        with:
          name: diamond-findings-${{ github.run_id }}
          path: site-data
      - name: Prepare self-contained site
        run: |
          mkdir -p _site
          cp site-data/catalog_export/index.html _site/index.html
          cp site-data/catalog_export/finds.csv _site/finds.csv
          cp site-data/catalog_export/finds.json _site/finds.json
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
