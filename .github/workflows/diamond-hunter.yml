name: Amazon Diamond Hunter FREE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bot.py'
      - 'alerts.py'
      - 'signals.py'
      - 'media.py'
      - 'catalog.py'
      - 'tests/**'
      - 'preferences-draft.json'
      - '.github/workflows/diamond-hunter.yml'
      - 'state-store.sh'
      - 'pricechecks.py'
  schedule:
    - cron: "7,22,37,52 * * * *"
    - cron: "0 19,20 * * *" # 21:00 Paris in summer/winter; bot checks local time
permissions:
  contents: read
concurrency:
  group: diamond-hunter
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish periodic public snapshots to diamond-data
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Restore seen-items cache
        # Preserve accumulated offers on push dry-run storefront rebuilds.
        uses: actions/cache/restore@v4
        with:
          path: |
            seen.json
            catalog.sqlite
          key: diamond-state-${{ github.run_id }}
          restore-keys: |
            diamond-state-
      - name: Restore durable catalog if Actions cache is missing
        run: bash state-store.sh restore
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Dry-run global RSS scan (push, no Telegram)
        if: github.event_name == 'push'
        env:
          DRY_RUN: 'true'
          CATALOG_ENABLED: 'true'
          EXTRA_RSS_FEEDS: ${{ vars.EXTRA_RSS_FEEDS }}
          PEPPER_GRAPHQL_ENABLED: 'true'
          # Push preview has no real-price key configured.
          MAX_NOTIFICATIONS: '3'
        run: python3 bot.py
      - name: Send Telegram connection test (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c 'from bot import telegram_send; telegram_send("💎 Amazon Diamond Hunter: тест успешен, Telegram подключён!")'
      - name: Scan and alert
        if: github.event_name != 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_DISCOUNT: '50'
          MAX_NOTIFICATIONS: '5'
          DRY_RUN: 'false'
          CATALOG_ENABLED: 'true'
          EXTRA_RSS_FEEDS: ${{ vars.EXTRA_RSS_FEEDS }}
        run: python3 bot.py
      - name: Save seen-items cache
        if: success() && github.event_name != 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            seen.json
            catalog.sqlite
          key: diamond-state-${{ github.run_id }}
      - name: Preserve durable daily catalog snapshot
        if: success() && github.event_name != 'push'
        continue-on-error: true
        run: bash state-store.sh backup
      - name: Publish browsable findings database
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: diamond-findings-${{ github.run_id }}
          path: |
            catalog.sqlite
            catalog_export/index.html
            catalog_export/finds.csv
            catalog_export/finds.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 9

  deploy_site:
    name: Publish free deal storefront
    needs: scan
    if: needs.scan.result == 'success'
    runs-on: ubuntu-latest
    # GitHub Pages may require one-time owner activation in Settings.
    # A deploy problem must not prevent scans and Telegram delivery.
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: diamond-hunter-pages
      cancel-in-progress: true
    steps:
      - name: Download storefront from this scan
        uses: actions/download-artifact@v4
        with:
          name: diamond-findings-${{ github.run_id }}
          path: site-data
      - name: Prepare self-contained site
        run: |
          mkdir -p _site
          cp site-data/catalog_export/index.html _site/index.html
          cp site-data/catalog_export/finds.csv _site/finds.csv
          cp site-data/catalog_export/finds.json _site/finds.json
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
