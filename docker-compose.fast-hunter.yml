services:
  diamond-fast-hunter:
    build:
      context: .
      dockerfile: Dockerfile.fast-hunter
    restart: unless-stopped
    env_file:
      - .env.hunter
    environment:
      DIRECT_INTERVAL_SECONDS: "${DIRECT_INTERVAL_SECONDS:-90}"
      DIRECT_MAX_QUERIES: "${DIRECT_MAX_QUERIES:-2}"
      DIRECT_WATCH_BATCHES: "${DIRECT_WATCH_BATCHES:-1}"
      KEEPA_MAX_DEAL_QUERIES_PER_DAY: "${KEEPA_MAX_DEAL_QUERIES_PER_DAY:-64}"
      BRIGHTDATA_PER_SCAN: "${BRIGHTDATA_PER_SCAN:-1}"
      BRIGHTDATA_SEARCH_PER_DAY: "${BRIGHTDATA_SEARCH_PER_DAY:-1}"
      RETAILER_ONLY: "true"
      MIN_DISCOUNT: "25"
      RETAIL_DIRECT_ENABLED: "true"
      RETAIL_PRODUCT_CHECKS_PER_SHOP: "2"
      RETAIL_SCAN_INTERVAL_SECONDS: "600"
    volumes:
      - fast-hunter-state:/data
volumes:
  fast-hunter-state:
